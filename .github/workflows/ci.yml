name: SDK checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18.0', '24']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: icc
          POSTGRES_PASSWORD: icc_test_only
          POSTGRES_DB: icc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U icc -d icc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://icc:icc_test_only@localhost:5432/icc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
